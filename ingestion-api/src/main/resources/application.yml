spring:
  application:
    name: ingestion-api
  datasource:
    url: ${HOOKRELAY_DB_URL:jdbc:postgresql://localhost:5433/hookrelay}
    username: ${HOOKRELAY_DB_USER:hookrelay}
    password: ${HOOKRELAY_DB_PASSWORD:hookrelay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${HOOKRELAY_REDIS_HOST:localhost}
      port: ${HOOKRELAY_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${HOOKRELAY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${HOOKRELAY_INGESTION_PORT:8080}
  tomcat:
    # Bound HTTP body size slightly above configured payload limit for headers/envelope.
    max-http-form-post-size: 300KB
    max-swallow-size: 300KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

hookrelay:
  api-key:
    # Optional pepper mixed into API key hashes. Changing it invalidates existing keys.
    pepper: ${HOOKRELAY_API_KEY_PEPPER:}
  endpoint-secret:
    # Base64-encoded 32-byte AES key. Required to start ingestion-api.
    key-base64: ${HOOKRELAY_ENDPOINT_SECRET_KEY}
    key-id: ${HOOKRELAY_ENDPOINT_SECRET_KEY_ID:local-v1}
  ssrf:
    # Allow http:// webhook URLs in local/dev. Profile "prod" sets this to false.
    allow-http: ${HOOKRELAY_ALLOW_HTTP:true}
  ingestion:
    max-payload-bytes: ${HOOKRELAY_MAX_PAYLOAD_BYTES:262144}
    event-retention-days: ${HOOKRELAY_EVENT_RETENTION_DAYS:30}
  outbox:
    relay-enabled: ${HOOKRELAY_OUTBOX_RELAY_ENABLED:true}
    batch-size: ${HOOKRELAY_OUTBOX_BATCH_SIZE:50}
    poll-interval-ms: ${HOOKRELAY_OUTBOX_POLL_INTERVAL_MS:1000}
    events-accepted-topic: ${HOOKRELAY_EVENTS_ACCEPTED_TOPIC:hookrelay.events.accepted}

logging:
  level:
    root: INFO
    dev.hookrelay: INFO

