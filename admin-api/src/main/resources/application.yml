spring:
  application:
    name: admin-api
  datasource:
    url: ${HOOKRELAY_DB_URL:jdbc:postgresql://localhost:5433/hookrelay}
    username: ${HOOKRELAY_DB_USER:hookrelay}
    password: ${HOOKRELAY_DB_PASSWORD:hookrelay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Schema ownership lives in ingestion-api for Milestone 0.
    enabled: false

  graphql:
    graphiql:
      enabled: ${HOOKRELAY_GRAPHIQL_ENABLED:true}
    schema:
      locations: classpath:graphql/

server:
  port: ${HOOKRELAY_ADMIN_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    dev.hookrelay: INFO
